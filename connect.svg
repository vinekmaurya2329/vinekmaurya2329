<svg xmlns="http://www.w3.org/2000/svg" width="900" height="240" viewBox="0 0 900 240" role="img" aria-label="Connect with me">
  <defs>
    <linearGradient id="aur3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/><stop offset="0.5" stop-color="#a78bfa"/><stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <pattern id="dots3" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" opacity="0.07"/>
    </pattern>
  </defs>
  <style>
    text { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
    .t { font-size: 15px; font-weight: 700; fill: #e5e7eb; }
    .s { font-size: 12px; fill: #94a3b8; }
  </style>

  <rect x="1" y="1" width="898" height="238" rx="22" fill="#0d0e16" stroke="url(#aur3)" stroke-width="1.5"/>
  <rect x="1" y="1" width="898" height="238" rx="22" fill="url(#dots3)"/>

  <!-- left: character placeholder (replace with your pointing-pose PNG as <image>) -->
  <g transform="translate(150,120)">
    <circle r="70" fill="#131526" stroke="#a78bfa" stroke-opacity="0.4" stroke-width="2"/>
    <circle r="70" fill="none" stroke="url(#aur3)" stroke-width="3" stroke-dasharray="50 390" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="6s" repeatCount="indefinite"/>
    </circle>
    <text y="12" font-size="38" font-weight="800" text-anchor="middle" fill="url(#aur3)">YN</text>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0;10,0;0,0" dur="1.4s" repeatCount="indefinite"/>
      <text x="82" y="8" font-size="26" fill="#22d3ee">👉</text>
    </g>
  </g>
  <text x="150" y="214" text-anchor="middle" font-size="12" fill="#94a3b8">Let's build something together</text>

  <!-- link cards -->
  <g transform="translate(320,28)">
    <rect width="260" height="80" rx="14" fill="#131526" stroke="#22d3ee" stroke-opacity="0.5"/>
    <circle cx="36" cy="40" r="18" fill="#22d3ee" fill-opacity="0.15"/>
    <text x="36" y="46" text-anchor="middle" font-size="15" font-weight="800" fill="#22d3ee">GH</text>
    <text x="70" y="36" class="t">GitHub</text><text x="70" y="56" class="s">github.com/USERNAME</text>
    <text x="232" y="46" font-size="18" fill="#22d3ee">→<animateTransform attributeName="transform" type="translate" values="0,0;6,0;0,0" dur="1.4s" repeatCount="indefinite"/></text>
  </g>
  <g transform="translate(600,28)">
    <rect width="260" height="80" rx="14" fill="#131526" stroke="#a78bfa" stroke-opacity="0.5"/>
    <circle cx="36" cy="40" r="18" fill="#a78bfa" fill-opacity="0.15"/>
    <text x="36" y="46" text-anchor="middle" font-size="15" font-weight="800" fill="#a78bfa">in</text>
    <text x="70" y="36" class="t">LinkedIn</text><text x="70" y="56" class="s">linkedin.com/in/USERNAME</text>
    <text x="232" y="46" font-size="18" fill="#a78bfa">→<animateTransform attributeName="transform" type="translate" values="0,0;6,0;0,0" dur="1.4s" begin="0.3s" repeatCount="indefinite"/></text>
  </g>
  <g transform="translate(320,128)">
    <rect width="260" height="80" rx="14" fill="#131526" stroke="#f472b6" stroke-opacity="0.5"/>
    <circle cx="36" cy="40" r="18" fill="#f472b6" fill-opacity="0.15"/>
    <text x="36" y="46" text-anchor="middle" font-size="15" font-weight="800" fill="#f472b6">@</text>
    <text x="70" y="36" class="t">Email</text><text x="70" y="56" class="s">you@example.com</text>
    <text x="232" y="46" font-size="18" fill="#f472b6">→<animateTransform attributeName="transform" type="translate" values="0,0;6,0;0,0" dur="1.4s" begin="0.6s" repeatCount="indefinite"/></text>
  </g>
  <g transform="translate(600,128)">
    <rect width="260" height="80" rx="14" fill="#131526" stroke="#22d3ee" stroke-opacity="0.5"/>
    <circle cx="36" cy="40" r="18" fill="#22d3ee" fill-opacity="0.15"/>
    <text x="36" y="46" text-anchor="middle" font-size="15" font-weight="800" fill="#22d3ee">W</text>
    <text x="70" y="36" class="t">Portfolio</text><text x="70" y="56" class="s">yourname.dev</text>
    <text x="232" y="46" font-size="18" fill="#22d3ee">→<animateTransform attributeName="transform" type="translate" values="0,0;6,0;0,0" dur="1.4s" begin="0.9s" repeatCount="indefinite"/></text>
  </g>
</svg>
