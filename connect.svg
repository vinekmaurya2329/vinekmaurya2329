<svg xmlns="http://www.w3.org/2000/svg" width="900" height="240" viewBox="0 0 900 240" role="img" aria-label="Connect with me">
  <defs>
    <linearGradient id="aur3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/><stop offset="0.5" stop-color="#a78bfa"/><stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <pattern id="dots3" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" opacity="0.07"/>
    </pattern>
  </defs>
  <style>
    text { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
    .t { font-size: 16px; font-weight: 700; fill: #e5e7eb; }
    .s { font-size: 13px; fill: #94a3b8; }
  </style>

  <rect x="1" y="1" width="898" height="238" rx="22" fill="#0d0e16" stroke="url(#aur3)" stroke-width="1.5"/>
  <rect x="1" y="1" width="898" height="238" rx="22" fill="url(#dots3)"/>

  <g transform="translate(150,112)">
    <circle r="70" fill="#131526" stroke="#a78bfa" stroke-opacity="0.4" stroke-width="2"/>
    <circle r="70" fill="none" stroke="url(#aur3)" stroke-width="3" stroke-dasharray="50 390" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="6s" repeatCount="indefinite"/>
    </circle>
    <text y="12" font-size="38" font-weight="800" text-anchor="middle" fill="url(#aur3)">VM</text>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0;10,0;0,0" dur="1.4s" repeatCount="indefinite"/>
      <text x="82" y="8" font-size="26" fill="#22d3ee">👉</text>
    </g>
  </g>
  <text x="150" y="212" text-anchor="middle" font-size="13" fill="#94a3b8">Let's build something together</text>

  <g transform="translate(320,36)">
    <rect width="540" height="76" rx="14" fill="#131526" stroke="#22d3ee" stroke-opacity="0.5"/>
    <circle cx="40" cy="38" r="20" fill="#22d3ee" fill-opacity="0.15"/>
    <text x="40" y="44" text-anchor="middle" font-size="15" font-weight="800" fill="#22d3ee">GH</text>
    <text x="78" y="34" class="t">GitHub</text><text x="78" y="56" class="s">github.com/USERNAME</text>
    <text x="500" y="46" font-size="20" fill="#22d3ee">→<animateTransform attributeName="transform" type="translate" values="0,0;8,0;0,0" dur="1.4s" repeatCount="indefinite"/></text>
  </g>
  <g transform="translate(320,126)">
    <rect width="540" height="76" rx="14" fill="#131526" stroke="#a78bfa" stroke-opacity="0.5"/>
    <circle cx="40" cy="38" r="20" fill="#a78bfa" fill-opacity="0.15"/>
    <text x="40" y="44" text-anchor="middle" font-size="16" font-weight="800" fill="#a78bfa">in</text>
    <text x="78" y="34" class="t">LinkedIn</text><text x="78" y="56" class="s">linkedin.com/in/vinekmaurya</text>
    <text x="500" y="46" font-size="20" fill="#a78bfa">→<animateTransform attributeName="transform" type="translate" values="0,0;8,0;0,0" dur="1.4s" begin="0.3s" repeatCount="indefinite"/></text>
  </g>
</svg>
