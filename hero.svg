<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320" role="img" aria-label="Vinek Maurya - Full Stack and Gen AI Developer">
  <defs>
    <linearGradient id="aur" x1="0" y1="0" x2="1" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f472b6"/>
      <animate attributeName="x1" values="0;0.6;0" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="1;1.6;1" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" opacity="0.07"/>
    </pattern>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="typeclip">
      <rect x="48" y="62" width="200" height="30">
        <animate attributeName="width" values="0;0;200" keyTimes="0;0.2;1" dur="2s" fill="freeze"/>
      </rect>
    </clipPath>
  </defs>
  <style>
    .f { animation: fade 1s ease both; }
    .d2 { animation-delay: .6s } .d3 { animation-delay: 1s } .d4 { animation-delay: 1.4s }
    @keyframes fade { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    text { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: 'SFMono-Regular', Consolas, 'Courier New', monospace; }
  </style>

  <rect x="1" y="1" width="898" height="318" rx="22" fill="#0d0e16" stroke="url(#aur)" stroke-width="1.5"/>
  <rect x="1" y="1" width="898" height="318" rx="22" fill="url(#dots)"/>
  <circle cx="710" cy="160" r="170" fill="url(#glow)"/>

  <g class="f">
    <rect x="48" y="26" width="168" height="28" rx="14" fill="#22d3ee" fill-opacity="0.1" stroke="#22d3ee" stroke-opacity="0.5"/>
    <circle cx="66" cy="40" r="4" fill="#22d3ee">
      <animate attributeName="r" values="3;6;3" dur="1.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.3;1" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <text x="80" y="45" font-size="13" fill="#a5f3fc">open to collabs</text>
  </g>

  <g clip-path="url(#typeclip)">
    <text x="48" y="84" font-size="20" fill="#cbd5e1" class="mono">Hi there, I'm</text>
  </g>

  <text x="48" y="140" font-size="54" font-weight="800" fill="url(#aur)" class="f d2">Vinek Maurya</text>

  <g font-size="22" fill="#e5e7eb">
    <text x="48" y="180" opacity="1">Full Stack Developer
      <animate attributeName="opacity" values="1;1;0;0;0" keyTimes="0;0.30;0.33;0.97;1" dur="9s" repeatCount="indefinite"/>
    </text>
    <text x="48" y="180" opacity="0">Gen AI Developer
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.33;0.36;0.63;0.66;1" dur="9s" repeatCount="indefinite"/>
    </text>
    <text x="48" y="180" opacity="0">System Design Enthusiast
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.66;0.69;0.97;1" dur="9s" repeatCount="indefinite"/>
    </text>
  </g>

  <text x="48" y="214" font-size="14" fill="#94a3b8" class="f d3">I love system design: building fast, scalable and secure products.</text>

  <g class="f d4" font-size="13" fill="#94a3b8">
    <g transform="translate(56,262)">
      <path d="M0-8a5 5 0 0 1 5 5c0 4-5 9-5 9s-5-5-5-9a5 5 0 0 1 5-5z" fill="none" stroke="#22d3ee" stroke-width="1.5"/>
      <circle cx="0" cy="-3" r="1.6" fill="#22d3ee"/>
    </g>
    <text x="70" y="262">Pratapgarh, Uttar Pradesh</text>
    <g transform="translate(280,256)">
      <rect x="-6" y="-6" width="12" height="12" rx="2" fill="none" stroke="#a78bfa" stroke-width="1.5"/>
      <path d="M-3-2h6M-3 2h6" stroke="#a78bfa" stroke-width="1.2"/>
    </g>
    <text x="294" y="262">Eg Payment</text>
    <g transform="translate(400,256)">
      <path d="M0-7l2 4.5 5 .5-3.7 3.3 1.1 4.9L0 3.6-4.4 6.2l1.1-4.9L-7-2l5-.5z" fill="none" stroke="#f472b6" stroke-width="1.3"/>
    </g>
    <text x="414" y="262">System Design</text>
  </g>

  <g>
    <g fill="none" stroke="#22d3ee" stroke-width="3" stroke-linecap="round" stroke-dasharray="40">
      <path d="M560 80V50h30"><animate attributeName="stroke-dashoffset" from="40" to="0" dur="1s" fill="freeze"/></path>
      <path d="M860 80V50h-30"><animate attributeName="stroke-dashoffset" from="40" to="0" dur="1s" fill="freeze"/></path>
      <path d="M560 240v30h30"><animate attributeName="stroke-dashoffset" from="40" to="0" dur="1s" fill="freeze"/></path>
      <path d="M860 240v30h-30"><animate attributeName="stroke-dashoffset" from="40" to="0" dur="1s" fill="freeze"/></path>
    </g>

    <circle cx="582" cy="70" r="5" fill="#ef4444">
      <animate attributeName="opacity" values="1;0.15;1" dur="1.2s" repeatCount="indefinite"/>
    </circle>
    <text x="594" y="74" font-size="11" fill="#e2e8f0" class="mono">REC  vinek_maurya.mp4</text>

    <circle cx="710" cy="160" r="62" fill="#131526" stroke="#a78bfa" stroke-opacity="0.4" stroke-width="2"/>
    <circle cx="710" cy="160" r="62" fill="none" stroke="url(#aur)" stroke-width="3" stroke-dasharray="60 330" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate" from="0 710 160" to="360 710 160" dur="5s" repeatCount="indefinite"/>
    </circle>
    <text x="710" y="173" font-size="40" font-weight="800" text-anchor="middle" fill="url(#aur)">VM</text>

    <rect x="580" y="252" width="260" height="4" rx="2" fill="#1e2133"/>
    <rect x="580" y="252" width="0" height="4" rx="2" fill="url(#aur)">
      <animate attributeName="width" values="0;260;260;0" keyTimes="0;0.65;0.95;1" dur="4s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
